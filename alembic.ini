[alembic]
# %(here)s makes this independent of the working directory (host, container, tests).
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally NOT set here. env.py reads DATABASE_URL from the environment
# (through the application's Settings), so no credentials ever live in this file.
