[project]
name = "rescueai"
version = "0.1.0"
description = "AI-powered job failure detection, diagnosis and recovery platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Bounded ranges here; exact versions are frozen in uv.lock (commit it).
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=6.0,<7.0",
    "structlog>=24.1",
    "celery[redis]>=5.5,<6",
    "alembic>=1.13,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rescueai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
# Generated/hand-edited migrations: long lines are normal; raw SQL via op.execute is intentional.
"alembic/versions/*" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "alembic"]

# Celery/kombu ship no type information; relax ONLY for them so strict mode stays on elsewhere.
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs real PostgreSQL and Redis (run with: pytest -m integration)",
]
